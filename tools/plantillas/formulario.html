<section class="box" id="fundadores-form"><h3>Hazte Miembro Fundador</h3>
<p class="legal">Acceso completo gratis hasta el 30 de noviembre de 2026 y precio fundador después.</p>
<form name="miembros-fundadores" method="POST" data-netlify="true" netlify-honeypot="bot-field" action="/gracias.html" class="frm">
<input type="hidden" name="form-name" value="miembros-fundadores"><p hidden><label>No llenar: <input name="bot-field"></label></p>
<label>Nombre<input name="nombre" required autocomplete="name"></label>
<label>Correo electrónico<input type="email" name="correo" required autocomplete="email"></label>
<label>País<input name="pais" required autocomplete="country-name"></label>
<label>Sitio web o red social (opcional)<input name="sitio"></label>
<label class="chk"><input type="checkbox" name="consentimiento" required> Acepto recibir información de Gol Élite Pro y la <a href="/privacidad.html">Política de privacidad</a>. Declaro ser mayor de 18 años.</label>
<button type="submit" class="cta">Quiero ser Miembro Fundador</button></form></section>
